name: firmware

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: |
          set -o pipefail
          pio run -d firmware 2>&1 | tee build.log

      # Put compiler errors in the run summary so they are readable at a glance.
      - name: Report compiler errors
        if: failure()
        run: |
          grep -E "(error|Error)[: ]" build.log | head -10 | while IFS= read -r line; do
            echo "::error::${line}"
          done
