; Air Mouse firmware — classic ESP32 DevKit (WROOM-32)
; Build:  pio run
; Flash:  pio run -t upload
; Serial: pio device monitor

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
build_flags =
    -DCORE_DEBUG_LEVEL=1
